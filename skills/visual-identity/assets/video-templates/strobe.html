<title>Dopamine Club Strobe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one dark stage, 16:9 canvas on top, transport controls under it. Single dark look on purpose. */
:root {
  --ink: #0B0D10;
  --graphite: #1B1E23;
  --line: #2A313C;
  --chalk: #EEF0F3;
  --mist: #A9B4C2;
  --hit: #FF3D24;
  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
body { background: var(--ink); color: var(--chalk); font-family: var(--display); }
main {
  max-width: 1240px; margin: 0 auto;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; justify-content: space-between; align-items: end; gap: 12px 24px; flex-wrap: wrap; }
h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }
h1 span { color: var(--hit); }
.meta { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mist); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: var(--ink); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
canvas { display: block; width: 100%; height: 100%; }
.bar { height: 4px; background: var(--graphite); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--hit); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: 600 15px var(--display); border: 0; border-radius: 999px; padding: 12px 20px; min-height: 44px; cursor: pointer; }
button.primary { background: var(--chalk); color: var(--ink); }
button.ghost { background: var(--graphite); color: var(--chalk); box-shadow: inset 0 0 0 1px var(--line); }
button:focus-visible { outline: 2px solid var(--hit); outline-offset: 3px; }
button:disabled { opacity: 0.5; cursor: default; }
.time { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums; }
.status { margin: 0; min-height: 1.4em; font-family: var(--mono); font-size: 13px; color: var(--chalk); }
.note { margin: 0; max-width: 68ch; font-size: 14px; line-height: 1.55; color: var(--mist); }
</style>

<main>
  <header>
    <h1>Dopamine Club strobe<span>.</span></h1>
    <p class="meta">20 s · 1920 × 1080 · 120 bpm · 26 doses</p>
  </header>
  <div class="stage"><canvas id="c" width="1920" height="1080" role="img" aria-label="Dopamine Club 20-second brand strobe"></canvas></div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="controls">
    <button class="primary" id="play" disabled>Play</button>
    <button class="ghost" id="loop" aria-pressed="false">Loop: off</button>
    <button class="ghost" id="rec" hidden>Record &amp; download video</button>
    <span class="time" id="time">00.0 / 20.0 s</span>
  </div>
  <p class="status" id="status" role="status">Loading images…</p>
  <p class="note">Cuts land on the beat, at most two and a half per second, so there are no strobing flashes. Recording plays the full 20 seconds in real time, so keep this tab visible, then offers the video as a file.</p>
</main>

<script>
(() => {
  const W = 1920, H = 1080, DUR = 20;
  const C = { ink: '#0B0D10', chalk: '#EEF0F3', hit: '#FF3D24', mist: '#A9B4C2' };
  const SYM = new Path2D('M183.27 56A96 96 0 1 0 183.27 136H144A40 40 0 0 1 144 56ZM32 56H48A40 40 0 0 1 48 136H32Z');
  const DISPLAY = '"Archivo", "Helvetica Neue", Arial, sans-serif';
  const MONO = '"JetBrains Mono", "Courier New", monospace';

  // Timeline: every segment starts on a beat; photo cuts never faster than 0.4 s.
  const T = []; let at = 0, shot = 0;
  const add = (d, o) => { T.push(Object.assign({ t0: at, d }, o)); at += d; };
  const photos = (keys, d) => keys.forEach(k => add(d, { type: 'photo', k, n: ++shot }));
  add(1.5, { type: 'dot' });
  add(1.0, { type: 'symbol', bg: C.ink, fg: C.chalk, dot: C.hit });
  photos(['run', 'grip', 'hero', 'pullup', 'deadlift', 'lunge', 'barbell', 'kb'], 0.5);
  add(0.5, { type: 'word', bg: C.hit, fg: C.ink, text: 'EARNED,' });
  add(0.5, { type: 'word', bg: C.ink, fg: C.chalk, text: 'NOT SCROLLED', stop: C.hit });
  photos(['facade', 'metro', 'wall', 'shop', 'cards', 'tee', 'bra', 'bottles'], 0.5);
  add(0.5, { type: 'symbol', bg: C.hit, fg: C.ink, dot: C.chalk });
  add(0.5, { type: 'symbol', bg: C.chalk, fg: C.ink, dot: C.hit });
  photos(['cap', 'socks', 'shaker', 'gymbag', 'shorts', 'steel', 'plate', 'athletes', 'stationery', 'lightbox'], 0.4);
  add(0.5, { type: 'word', bg: C.chalk, fg: C.ink, text: 'SHOW UP', stop: C.hit });
  add(0.5, { type: 'word', bg: C.ink, fg: C.chalk, text: 'LIFT', stop: C.hit });
  add(0.5, { type: 'word', bg: C.hit, fg: C.ink, text: 'REPEAT', stop: C.ink });
  add(2.0, { type: 'end' });
  const TOTAL_SHOTS = shot;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const imgs = {};
  const keys = [...new Set(T.filter(s => s.type === 'photo').map(s => s.k))];

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
  const easeBack = p => { p = clamp(p, 0, 1); const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

  function symbol(x, y, size, fg, dot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 192, size / 192);
    ctx.fillStyle = fg;
    ctx.fill(SYM, 'evenodd');
    ctx.beginPath(); ctx.arc(144, 96, 16, 0, Math.PI * 2);
    ctx.fillStyle = dot; ctx.fill();
    ctx.restore();
  }

  function cover(img, scale, ox, oy) {
    const r = Math.max(W / img.width, H / img.height) * scale;
    const w = img.width * r, h = img.height * r;
    ctx.drawImage(img, (W - w) / 2 + ox * W, (H - h) / 2 + oy * H, w, h);
  }

  function pill(text, x, y, align) {
    ctx.font = '500 28px ' + MONO;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    const w = ctx.measureText(text).width + 36;
    const left = align === 'right' ? x - w : x;
    ctx.fillStyle = C.ink;
    ctx.fillRect(left, y, w, 52);
    ctx.fillStyle = C.chalk;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText(text, left + 18, y + 27);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function bigWord(text, fg, stop, p) {
    let size = 300;
    ctx.font = '800 ' + size + 'px ' + DISPLAY;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '-6px';
    const stopR = stop ? size * 0.09 : 0;
    let w = ctx.measureText(text).width + (stop ? stopR * 3 : 0);
    if (w > 1640) { size = size * 1640 / w; ctx.font = '800 ' + size + 'px ' + DISPLAY; w = 1640; }
    const s = 1.05 - 0.05 * easeOut(p * 2);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.fillStyle = fg; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    const left = -w / 2, base = size * 0.36;
    ctx.fillText(text, left, base);
    if (stop) {
      const tw = ctx.measureText(text).width;
      ctx.beginPath(); ctx.arc(left + tw + size * 0.13, base - size * 0.09, size * 0.09, 0, Math.PI * 2);
      ctx.fillStyle = stop; ctx.fill();
    }
    ctx.restore();
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function render(t) {
    t = clamp(t, 0, DUR - 0.001);
    const seg = T.find(s => t >= s.t0 && t < s.t0 + s.d) || T[T.length - 1];
    const lt = t - seg.t0, p = lt / seg.d;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    if (seg.type === 'dot') {
      ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
      const grow = easeBack(lt / 0.45);
      const pulse = lt > 0.9 ? 1 + 0.14 * Math.max(0, Math.sin((lt - 0.9) * Math.PI / 0.5)) : 1;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 70 * grow * pulse, 0, Math.PI * 2);
      ctx.fillStyle = C.hit; ctx.fill();
      if (lt > 0.6) {
        ctx.globalAlpha = easeOut((lt - 0.6) / 0.3);
        ctx.font = '500 30px ' + MONO; ctx.fillStyle = C.mist;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if ('letterSpacing' in ctx) ctx.letterSpacing = '8px';
        ctx.fillText('THE DOSE IS EARNED', W / 2, H / 2 + 190);
        if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
        ctx.globalAlpha = 1;
      }
    } else if (seg.type === 'symbol') {
      ctx.fillStyle = seg.bg; ctx.fillRect(0, 0, W, H);
      const size = 560 * (1.12 - 0.12 * easeOut(lt / 0.18));
      symbol(W / 2 - size / 2, H / 2 - size / 2, size, seg.fg, seg.dot);
    } else if (seg.type === 'photo') {
      const img = imgs[seg.k];
      ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
      if (img) {
        const dir = seg.n % 2 ? 1 : -1;
        cover(img, 1.1 - 0.08 * p, dir * 0.015 * p, 0);
      }
      symbol(64, 56, 84, C.chalk, C.hit);
      pill('DOSE ' + String(seg.n).padStart(2, '0') + ' / ' + TOTAL_SHOTS, W - 64, 72, 'right');
      pill('DOPAMINE CLUB®', 64, H - 120, 'left');
    } else if (seg.type === 'word') {
      ctx.fillStyle = seg.bg; ctx.fillRect(0, 0, W, H);
      bigWord(seg.text, seg.fg, seg.stop, p);
    } else {
      ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
      const a = easeOut(lt / 0.25);
      const beat = 1 + 0.12 * Math.max(0, Math.sin(lt * Math.PI * 2));
      const sx = 300, sy = 380, ss = 320;
      ctx.save();
      ctx.translate(sx + ss / 2, sy + ss / 2); ctx.scale(0.9 + 0.1 * a, 0.9 + 0.1 * a); ctx.translate(-(sx + ss / 2), -(sy + ss / 2));
      ctx.translate(sx, sy); ctx.scale(ss / 192, ss / 192);
      ctx.fillStyle = C.chalk; ctx.fill(SYM, 'evenodd');
      ctx.beginPath(); ctx.arc(144, 96, 16 * beat, 0, Math.PI * 2); ctx.fillStyle = C.hit; ctx.fill();
      ctx.restore();
      const wa = easeOut((lt - 0.15) / 0.35);
      ctx.globalAlpha = wa;
      ctx.font = '600 156px ' + DISPLAY; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '-6px';
      ctx.fillStyle = C.chalk;
      const tx = 700 + (1 - wa) * 40;
      ctx.fillText('Dopamine Club', tx, 600);
      const tw = ctx.measureText('Dopamine Club').width;
      ctx.beginPath(); ctx.arc(tx + tw + 22, 588, 15, 0, Math.PI * 2); ctx.fillStyle = C.hit; ctx.fill();
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.globalAlpha = easeOut((lt - 0.6) / 0.4);
      ctx.font = '500 34px ' + MONO; ctx.fillStyle = C.mist;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '10px';
      ctx.fillText('EARNED, NOT SCROLLED.', 706, 690);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.globalAlpha = 1;
    }
    // progress line, the dose filling up
    ctx.fillStyle = C.hit;
    ctx.fillRect(0, H - 8, W * (t / DUR), 8);

    document.getElementById('bar').style.width = (t / DUR * 100) + '%';
    document.getElementById('time').textContent = t.toFixed(1).padStart(4, '0') + ' / 20.0 s';
  }

  // Transport
  const playBtn = document.getElementById('play');
  const loopBtn = document.getElementById('loop');
  const recBtn = document.getElementById('rec');
  const status = document.getElementById('status');
  let raf = 0, start = 0, playing = false, loop = false, onEnd = null;

  function tick(now) {
    const t = (now - start) / 1000;
    if (t >= DUR) {
      render(DUR);
      if (loop && !onEnd) { start = now; raf = requestAnimationFrame(tick); return; }
      playing = false; playBtn.textContent = 'Replay';
      const cb = onEnd; onEnd = null; if (cb) cb();
      return;
    }
    render(t);
    raf = requestAnimationFrame(tick);
  }
  function play(cb) {
    cancelAnimationFrame(raf);
    onEnd = cb || null; playing = true; playBtn.textContent = 'Stop';
    start = performance.now(); raf = requestAnimationFrame(tick);
  }
  function stop() {
    cancelAnimationFrame(raf); playing = false; onEnd = null;
    playBtn.textContent = 'Play'; render(DUR);
  }
  playBtn.addEventListener('click', () => playing ? stop() : play());
  loopBtn.addEventListener('click', () => {
    loop = !loop; loopBtn.setAttribute('aria-pressed', String(loop));
    loopBtn.textContent = 'Loop: ' + (loop ? 'on' : 'off');
  });

  async function record(downloads) {
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
      .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime || !cv.captureStream) { status.textContent = 'This browser cannot record the canvas. Try Chrome or Edge.'; return; }
    const chunks = [];
    const rec = new MediaRecorder(cv.captureStream(30), { mimeType: mime, videoBitsPerSecond: 12000000 });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      status.textContent = 'Recorded ' + (blob.size / 1048576).toFixed(1) + ' MB. Confirm the download…';
      try {
        await downloads.save({ filename: 'dopamine-club-strobe.' + ext, data: blob });
        status.textContent = 'Video saved as dopamine-club-strobe.' + ext + '.';
      } catch (e) {
        const code = e && e.code;
        status.textContent = code === 'declined' ? 'Download cancelled.'
          : code === 'rate_limited' ? 'A download prompt is already open. Try again in a moment.'
          : 'This view cannot save files.';
      }
      recBtn.disabled = false; playBtn.disabled = false; loopBtn.disabled = false;
    };
    recBtn.disabled = true; playBtn.disabled = true; loopBtn.disabled = true;
    status.textContent = 'Recording… 20 seconds.';
    render(0);
    rec.start(250);
    play(() => setTimeout(() => rec.stop(), 150));
  }

  async function boot() {
    try { await Promise.all([document.fonts.load('800 100px ' + DISPLAY), document.fonts.load('600 100px ' + DISPLAY), document.fonts.load('500 30px ' + MONO)]); } catch (e) {}
    await Promise.all(keys.map(k => new Promise(res => {
      const im = new Image();
      im.onload = () => { imgs[k] = im; res(); };
      im.onerror = () => res();
      im.src = 'img/' + k + '.jpg';
    })));
    const missing = keys.filter(k => !imgs[k]).length;
    const m = /^#t([\d.]+)$/.exec(location.hash);
    render(m ? parseFloat(m[1]) : 18.8);
    playBtn.disabled = false;
    status.textContent = missing ? missing + ' images did not load; their shots show black.' : 'Ready. Press Play.';
    const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (downloads && window.MediaRecorder && cv.captureStream) {
      recBtn.hidden = false;
      recBtn.addEventListener('click', () => record(downloads));
    }
  }
  boot();
})();
</script>
